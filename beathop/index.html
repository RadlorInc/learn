<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BeatHop</title>
<style>
  :root { --ink: #1d3557; --card: #ffffffee; --accent: #ff7a1a; --soft: #e8f1fb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 14px; min-height: 44px; padding: 10px 18px; font-weight: 700; }
  .big { background: var(--accent); color: #fff; font-size: 18px; box-shadow: 0 4px 0 #c45500; }
  .big:active { transform: translateY(3px); box-shadow: 0 1px 0 #c45500; }
  .plain { background: var(--soft); color: var(--ink); }
  .hidden { display: none !important; }
  /* keyboard keys: a strip while playing and a list on the pause screen, only on a computer (a touch screen is tapped) */
  kbd { display: inline-block; min-width: 1.7em; padding: 1px 6px; border-radius: 6px; background: #fff; color: #1d3557; border: 1px solid #1d355740; border-bottom-width: 3px; font: 800 12px system-ui, sans-serif; text-align: center; }
  #keys { position: fixed; left: 12px; top: max(58px, calc(env(safe-area-inset-top) + 48px)); background: #ffffffd9; border-radius: 14px; padding: 6px 12px; font-weight: 700; white-space: nowrap; pointer-events: none; display: none; }
  .controls { text-align: left; margin: 4px auto 12px; max-width: 420px; display: none; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
  .controls dt { text-align: right; white-space: nowrap; }
  .controls dd { margin: 0; font-weight: 600; }
  @media (hover: hover) and (pointer: fine) { #keys:not(.hidden) { display: block; } .controls { display: grid; } }

  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: #1d355766; overflow: auto; }
  .card { background: var(--card); border-radius: 22px; padding: 22px; width: min(560px, 100%); text-align: center; box-shadow: 0 10px 40px #0003; }
  h1 { margin: 0 0 4px; font-size: clamp(34px, 8vw, 52px); letter-spacing: 1px; color: var(--accent); text-shadow: 0 3px 0 #c45500; }
  h2 { margin: 0 0 10px; }
  .sub { margin: 0 0 16px; opacity: .8; }
  .levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
  .lvl { background: var(--soft); border-radius: 16px; padding: 12px; text-align: left; min-height: 96px; display: flex; flex-direction: column; gap: 4px; }
  .lvl b { font-size: 16px; }
  .lvl small { opacity: .75; }
  .lvl.locked { opacity: .45; cursor: not-allowed; }
  .stars { font-size: 20px; letter-spacing: 2px; }
  .swatches { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .sw { width: 44px; height: 44px; padding: 0; border-radius: 12px; box-shadow: inset 0 -4px 0 #0002; }
  .sw.on { outline: 4px solid var(--ink); outline-offset: 2px; }
  .hats { margin-top: 10px; gap: 8px; }
  .hat { padding: 8px 12px; }
  .hat.on { outline: 3px solid var(--ink); }
  .hat.locked { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .stat { font-size: 18px; margin: 6px 0; }

  #hud { position: fixed; left: 0; right: 0; top: 0; padding: max(10px, env(safe-area-inset-top)) 12px 0; display: flex; align-items: center; gap: 10px; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .pill { background: #ffffffd9; border-radius: 999px; padding: 6px 12px; font-weight: 800; white-space: nowrap; }
  #bar { flex: 1; height: 12px; background: #ffffff99; border-radius: 99px; overflow: hidden; min-width: 60px; }
  #barIn { height: 100%; width: 0; background: linear-gradient(90deg, #ffd23f, var(--accent)); }
  .icon { min-width: 44px; padding: 0 10px; background: #ffffffd9; border-radius: 999px; }
  #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: #ffffffee; padding: 10px 18px; border-radius: 14px; font-weight: 800; font-size: 20px; pointer-events: none; transition: opacity .3s; }
  #hint { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: #ffffffe6; padding: 10px 16px; border-radius: 14px; font-weight: 700; text-align: center; width: max-content; max-width: calc(100% - 32px); pointer-events: none; transition: opacity .4s; }
  #turn { font-size: 14px; opacity: .7; margin-top: 10px; }
  @media (orientation: landscape) { #turn { display: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <button class="icon" id="bPause" aria-label="Pause">❚❚</button>
  <div id="bar" role="progressbar" aria-label="How far through the level"><div id="barIn"></div></div>
  <span class="pill" id="pct">0%</span>
  <span class="pill" id="gems">💎 0</span>
  <span class="pill" id="tries">Try 1</span>
  <span class="pill hidden" id="timer"></span>
</div>
<div id="keys" class="hidden"><kbd>Space</kbd> jump — hold it to go higher · <kbd>Esc</kbd> pause</div>
<div id="toast" style="opacity:0"></div>
<div id="hint" style="opacity:0"></div>

<div id="title" class="screen">
  <div class="card">
    <h1>BeatHop</h1>
    <p class="sub">One button. Jump, glide and flip to the flag! Tap, click or press <kbd>Space</kbd> to jump.</p>
    <div class="swatches" id="swatches" aria-label="Pick your colour"></div>
    <div class="row hats" id="hats" aria-label="Pick a hat"></div>
    <p class="sub" id="bank" style="margin:8px 0 0"></p>
    <div class="levels" id="levels"></div>
    <div class="row">
      <button class="plain" id="bSlow">🐢 Slow mode: off</button>
      <button class="plain" id="bMute">🔊 Sound on</button>
      <button class="plain hidden" id="bLeave">Stop and keep my minutes</button>
    </div>
    <p id="turn">Turn your device sideways for a bigger view.</p>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="card">
    <h2>Paused</h2>
    <dl class="controls">
      <dt><kbd>Space</kbd> <kbd>↑</kbd> <kbd>W</kbd> or click</dt><dd>Jump — hold it to go higher</dd>
      <dt><kbd>Esc</kbd> <kbd>P</kbd></dt><dd>Pause</dd>
    </dl>
    <div class="row">
      <button class="big" id="bResume">Keep playing</button>
      <button class="plain" id="bRestart">Start the level again</button>
      <button class="plain" id="bLevels">All levels</button>
    </div>
  </div>
</div>

<div id="win" class="screen hidden">
  <div class="card">
    <h2 id="winTitle">Level complete!</h2>
    <div class="stars" id="winStars" style="font-size:40px"></div>
    <p class="stat" id="winStats"></p>
    <div class="row">
      <button class="big" id="bNext">Next level</button>
      <button class="plain" id="bAgain">Play again</button>
      <button class="plain" id="bLevels2">All levels</button>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
