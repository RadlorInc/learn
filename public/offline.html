<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radlic — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, #F7FBFF 0%, #EFF8FF 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px; gap: 20px; text-align: center;
    }
    .emoji { font-size: 72px; }
    h1 { font-size: 24px; font-weight: 800; color: #083D85; }
    p  { font-size: 16px; color: #3D6FB8; max-width: 300px; line-height: 1.5; }
    button {
      background: #A5D6FB;
      color: #0B4FA8; border: none; border-radius: 50px;
      padding: 14px 32px; font-size: 16px; font-weight: 800;
      cursor: pointer; margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>You're offline</h1>
  <p>Radlic needs internet to load. Connect and tap retry — your progress is saved!</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
