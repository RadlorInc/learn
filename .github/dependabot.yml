version: 2
updates:
  # npm dependencies — weekly, so a patched release for a new CVE lands as a PR promptly.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk dev/tooling bumps into one PR to cut noise.
      dev-tooling:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript"
          - "vitest"
          - "jsdom"
          - "tailwindcss"
          - "@tailwindcss/*"
    labels:
      - dependencies
      - security

  # Keep GitHub Actions (checkout, setup-node, …) patched too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
