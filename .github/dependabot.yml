version: 2

# ⚠️ WHY THIS FILE LOOKS THE WAY IT DOES — measured 2026-09-09, after a critical `next` RCE advisory
# (GHSA-p293-qw3h-jr36) sat unnoticed and NO Dependabot PR existed for it.
#
# Two separate mechanisms were involved, and only ONE of them lives in this file:
#
#   · Dependabot ALERTS and SECURITY UPDATES were switched off at the REPOSITORY level. Nothing in
#     this file can turn those on — the `updates:` block below governs VERSION updates only. They
#     are now enabled (Settings -> Advanced Security).
#   · The npm VERSION-update path was blocked by `open-pull-requests-limit`, which sat full at 5/5
#     for 19 days, so an ordinary in-range 16.3.1 -> 16.3.4 bump had no slot to appear in.
#
# ⚠️⚠️ AND THE THING THAT IS EASY TO GET WRONG, BECAUSE IT IS INTUITIVE AND FALSE:
# `open-pull-requests-limit` DOES NOT APPLY TO SECURITY UPDATES. GitHub's options reference:
#   "Security update pull requests are not subject to this limit and do not count toward it."
#   "There is no limit on the number of open pull requests for security updates."
# So a full queue can starve you of version bumps — which is what happened — but it can NEVER block
# a security PR. Raising the limit below is about keeping routine bumps flowing, and buys exactly
# nothing in the security path. Do not let it be described as a security fix.

updates:
  # npm dependencies — weekly, so a patched release for a new CVE lands as a PR promptly.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # ⚠️ 5 was too tight for this dependency count on a weekly schedule: the queue sat full for 19
    # days and the newest bump had nowhere to go. 10 is the trade — see the PR for the review-load
    # arithmetic. This governs VERSION updates only (see the note above).
    open-pull-requests-limit: 10
    groups:
      # ⚠️ THE REACT PAIR MUST ARRIVE AS ONE PR OR IT CANNOT INSTALL AT ALL.
      # `react` and `react-dom` are both EXACT-pinned, so Dependabot raises them separately — and
      # `react-dom@X` declares `peer react@"^X"`, so the react-dom half alone dies:
      #     npm error While resolving: react-dom@19.2.8
      #     npm error Found: react@19.2.4
      #     npm error Conflicting peer dependency: react@19.2.8
      # That is not hypothetical. PR #42 (react-dom moved, react left behind) was red on `npm ci`
      # from 2026-08-25 until it was closed, and PR #85 was the SAME failure mirrored (react moved,
      # react-dom left behind) three weeks later. Grouping them is what stops a third round.
      # ⚠️ Deliberately narrow: `react` and `react-dom` ONLY — and ALL update types, majors included:
      # a React major is exactly the bump that splits the pair. (Its type pair has its own group below.)
      react:
        patterns:
          - "react"
          - "react-dom"
      # ⚠️ THE TYPE PAIR IS PEER-LOCKED TOO, SO IT GETS THE SAME TREATMENT (2026-09-26). `@types/react-dom@19.3.0`
      # declares peer `@types/react ^19.3.0`; split, `npm ci --dry-run` exits 1 with the #42/#85 text
      # ("Conflicting peer dependency"), measured. ALL update types, and it MUST stay ABOVE dev-tooling:
      # a dependency joins the FIRST group it matches, and dev-tooling's `@types/*` would otherwise take
      # these two and split their majors.
      react-types:
        patterns:
          - "@types/react"
          - "@types/react-dom"
      # Batch low-risk dev/tooling bumps into one PR — MINOR AND PATCH ONLY (2026-09-26, founder's call).
      # A major of any of these now arrives as its OWN PR ("All major updates will continue to be raised
      # as individual pull requests" — GitHub, optimizing-pr-creation Example 3), because one major in
      # the group made the whole group unmergeable (#47, #133, #229 — each closed for its majors).
      # ⚠️ What the separate majors will look like, measured 2026-09-26 with `npm ci --dry-run`:
      #   · vitest 5 declares peerOptional `@types/node ^22 || >=24` — ALONE it does not resolve
      #     (ERESOLVE) while @types/node is ^20. Take the @types/node major first.
      #   · typescript 7 and eslint 10 install only by overriding peer ranges (typescript-eslint caps
      #     TS <6.1; eslint-plugin-{import,jsx-a11y,react} cap eslint ^9). TS 7 is expected red: the
      #     `childWords` gate uses the JS compiler API TS 7 does not ship (#229).
      # ⚠️ CLOSING A MAJOR PR IGNORES NOTHING — the next release re-raises it after the cooldown. Only an
      # `ignore:` entry with `update-types: ["version-update:semver-major"]` silences a major; none exists.
      # ⚠️ `applies-to` is deliberately absent everywhere: groups then govern VERSION updates only, so
      # SECURITY updates stay ungrouped (options reference: "When undefined, defaults to version
      # updates"). The repo-level "Grouped security updates" switch (Settings → Advanced Security)
      # can group them anyway and is NOT readable via the REST API — it must be OFF for that to hold.
      dev-tooling:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript"
          - "vitest"
          - "jsdom"
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
    # ⚠️ `security` WAS LISTED HERE AND HAS BEEN REMOVED — it was a lie about what these PRs are.
    # `labels:` applies to security update PRs as well as version ones ("Setting this option will
    # also affect pull requests for security updates to the manifest files of this package
    # manager"), so there is NO way to express "label only the security ones" here. Listing
    # `security` therefore stamped it on every routine "a new version exists" bump, which is a
    # filter that matches everything, i.e. not a filter.
    # ⚠️ Nothing applies a `security` label automatically, so no such label exists in this repo by
    # design. A security PR is identified by its Dependabot ALERT, not by a label.
    labels:
      - dependencies

  # Keep GitHub Actions (checkout, setup-node, …) patched too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
