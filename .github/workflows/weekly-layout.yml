name: Weekly KG–2 tap sweep

# "Can a child actually tap it", for the 23 KG–2 chapters children play at `/game?c=<id>`:
# `e2e/xbrowser-clicks.spec.ts` plays each chapter from a seeded mid-run state to its end card, hit-tests
# every visible control on every screen it passes (is the element at the control's centre the control
# itself?), then presses the end card's real buttons. Chromium only here; the 13-profile matrix stays a
# local pre-launch run (docs/runbooks/deploy.md).
#
# ⚠️ FROM 2026-09-13 TO 2026-10 THIS FILE TESTED NOTHING AND SHOWED GREEN. A `legacy-gate` job skipped it
# while `LEGACY_CHAPTERS_HIDDEN` was true, and the spec it named (the short-landscape sweep of the teen
# shell's layout sweep) had been deleted with that shell. Both are gone; `src/__tests__/workflowSpecs.test.ts`
# fails any PR in which a workflow names a spec that does not exist.
#
# ⚠️ WHY WEEKLY AND NOT NIGHTLY: it plays every chapter rather than opening it, so it is the slow one, and
# the defects it catches arrive with a layout change, not with time. Run it on demand (workflow_dispatch)
# after touching a KG–2 chapter's layout. Do not widen the schedule without a reason: Actions minutes.
#
# Against a PRODUCTION BUILD on the runner (as nightly-e2e.yml, which explains why), never production.

on:
  schedule:
    - cron: '40 4 * * 1' # Mondays 04:40 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Narrow to chapters (comma-separated, e.g. counting,shapes)'
        required: false
        default: ''
  pull_request:
    paths: ['.github/workflows/weekly-layout.yml', 'e2e/xbrowser-clicks.spec.ts']

permissions:
  contents: read
  issues: write        # a red scheduled run files the notice below

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # 23 chapters, each capped by the spec's own play budget; capped so a hang cannot idle
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24   # = the Vercel project's nodeVersion (24.x); CI must test the Node production runs
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx next build

      - name: Start production server
        run: |
          # nohup + disown so it survives this step's shell; a plain `&` fails later as a wall of
          # navigation errors rather than as a missing server.
          nohup npx next start -p 3017 > /tmp/next-start.log 2>&1 &
          disown || true
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:3017/api/health)" = "200" ]; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become healthy in 60s"; cat /tmp/next-start.log; exit 1

      - name: KG–2 tap sweep (23 chapters)
        # The input arrives via `env:`, never interpolated into the script (see nightly-e2e.yml).
        # Set only when non-empty: a `schedule` run passes '' for an unset input.
        env:
          ONLY_INPUT: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY_INPUT" ]; then
            export E2E_ONLY="$ONLY_INPUT"
          fi
          set -o pipefail
          npx playwright test e2e/xbrowser-clicks.spec.ts 2>&1 | tee /tmp/e2e.log

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layout-trace-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      # A red scheduled run nobody is told about is the same as no run: one issue, updated in place,
      # closed by the next green run (the pattern in nightly-e2e.yml and daily-smoke.yml).
      - name: File (or update) the failure notice
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='Weekly KG–2 tap sweep is red'
          FAILING=$(grep -E '^\s+✘' /tmp/e2e.log | sed 's/([0-9.]*m*s)//' | head -20 || true)
          [ -n "$FAILING" ] || FAILING='(the run failed before any test reported — see the log)'
          BODY=$(printf '%s\n\n```\n%s\n```\n\n%s\n' \
            "Last red run: $RUN_URL (commit ${GITHUB_SHA:0:7})" "$FAILING" \
            "Updated in place while red; closed by the next green run.")
          EXISTING=$(gh issue list -R "$REPO" --state open --search "$TITLE in:title" --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" -R "$REPO" --body "$BODY"
          else gh issue create -R "$REPO" --title "$TITLE" --body "$BODY" --label bug || gh issue create -R "$REPO" --title "$TITLE" --body "$BODY"; fi

      - name: Close the notice on a green run
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh issue list -R "$REPO" --state open --search 'Weekly KG–2 tap sweep is red in:title' --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then gh issue close "$EXISTING" -R "$REPO" --comment "Green again: $RUN_URL"; fi
