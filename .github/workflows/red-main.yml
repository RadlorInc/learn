name: Red main

# ⚠️ WHY THIS EXISTS. On 2026-09-05 `ci / rls-tests` failed on five consecutive commits to main and
# nobody noticed for a day. Measured afterwards: NO branch protection, NO required status check, NO
# workflow reading a CI result — and Vercel building on push independently, so all five red commits
# reached production READY. CI was a report nobody read.
#
# It now watches BOTH directions, because they are the same defect mirrored:
#
#   · CI red        -> broken code would have gone live      (the original failure)
#   · promote red   -> WORKING code silently does NOT go live (the gate failing closed)
#   · drift         -> the gate quietly stopped passing anything through at all
#
# The third is the one that hides: a gate that has silently stopped promoting looks identical to a
# quiet week with no pushes. Nothing errors, nothing is red, production just stops moving.
#
# ⚠️ IT ALSO CLOSES THEM (2026-10-06). Before, it never closed one: seven went stale, and four "database NOT
# migrated" issues were false (a staging failure on a push with no migration pending). Every finished Deploy run on
# main now runs this, red or green: a red run opens or comments on its kind, and any run closes the kinds its own
# jobs prove fixed. The rules, and why issues are matched on the exact title and never by search, are in
# scripts/red-main.mjs (driven by src/__tests__/redMain.test.ts).

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '37 6 * * *'          # daily drift check
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which path to drive (for verifying this notifier actually fires)'
        type: choice
        options: [ci-red, promote-red, drift]
        default: drift

permissions:
  issues: write    # open, comment on and close the issues
  actions: read    # the Deploy run's jobs
  contents: read   # the checkout of the script, and the release...main compare

jobs:
  notify:
    if: >-
      ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a few seconds; 10 min floor (ARC-07; GitHub default 360)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/red-main.mjs
          sparse-checkout-cone-mode: false
      - name: Open, update or close the issues
        env:
          GH_TOKEN: ${{ github.token }}
          # ⚠️ gh needs a repo context and the checkout is sparse: every call passes -R "$REPO". Found by DRIVING
          # the first version, which without it could not have fired at all.
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/red-main.mjs
