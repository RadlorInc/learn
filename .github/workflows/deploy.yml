name: Deploy

# Production pipeline. On push to main: run CI, apply migrations to STAGING + prove the RLS
# suite there, then apply the SAME migrations to PROD behind a required-reviewer approval gate.
# ⚠️ PRODUCTION DEPLOYS ARE GATED BY CI VIA THE `release` BRANCH. Vercel's Production Branch is
# `release`, not `main`, and the `promote` job below is the only thing that moves it — so a red CI
# means `release` never advances and production simply keeps serving the last good commit.
#
# Measured 2026-09-05, before this existed: `ci / rls-tests` failed on five consecutive commits to
# main and ALL FIVE reached production with state READY. There was no branch protection, no
# required status check and nothing reading a CI result. CI was a report nobody read.
#
# Branch protection would not have helped — required checks only gate merges via PR, and a direct
# push to main runs its checks after the push. Vercel's Ignored Build Step would not either: it
# runs seconds after the push while CI takes minutes, so the commit status is still `pending`.
# Promoting a branch is the one mechanism that needs no token and no change to how anyone works.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false # never abort a half-applied migration mid-flight

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # The gate. `needs: ci` is the whole mechanism: a red CI means this job never runs, `release`
  # never moves, and Vercel has nothing new to build.
  #
  # ⚠️ ITS OWN FAILURE MUST NOT BE SILENT. If this step breaks — permissions, a rejected push, a
  # bad ref — production stops updating and looks exactly like "nothing changed", which is the
  # mirror of the defect this gate exists to fix: instead of broken code going live, working code
  # silently does not. `red-main.yml` fires on a failed Deploy run and names WHICH half failed, and
  # a scheduled drift check catches the case where this stops passing things through quietly.
  promote:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p95 0.7 min over 26 runs; 10 min floor (ARC-07; GitHub default 360)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Promote main to release (this is what Vercel builds)
        run: |
          set -euo pipefail
          echo "promoting $(git rev-parse --short HEAD) to release"
          git push origin HEAD:release
          echo "release now at $(git rev-parse --short HEAD)"

  migrate-staging:
    needs: ci
    # Inert until the staging project is configured (see docs/devops.md) — skips cleanly
    # (green), so the pipeline never shows a false failure before the dashboard setup is done.
    if: ${{ vars.STAGING_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # never run yet; same shape as migrate-prod (ARC-07; GitHub default 360)
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0   # pinned: `latest` asks the GitHub API and a rate limit failed a deploy (2026-09-17)
      # The mirror of the prod guard, and the worse direction: a STAGING ref pointing at production
      # would `db push` AND run the RLS regression suite — which writes — against real children's
      # data. Never trust two dashboard variables to differ.
      - name: Refuse if the staging ref is production
        env:
          STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
        run: |
          if [ "$STAGING_PROJECT_REF" = "wrnjqjhrbnqxornmfisf" ]; then
            echo "::error::STAGING_PROJECT_REF is the PRODUCTION project. Refusing — this job pushes"
            echo "::error::migrations and runs a suite that WRITES. See scripts/assert-prod-ref.sh."
            exit 1
          fi
      - name: Apply migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.STAGING_PROJECT_REF }}"
          supabase db push
      - name: RLS regression suite (staging)
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_DB_URL" ]; then
            echo "::warning::STAGING_DB_URL not set — skipping RLS suite. See docs/devops.md."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_regression.sql

  # Did this push change a migration file? Without this, migrate-prod would wait for a human on
  # EVERY push to main — and because `concurrency` above queues runs without cancelling, the next
  # push's `promote` would sit behind that waiting approval, so no deploy could land until someone
  # approved or rejected a migration run that had nothing to apply.
  #
  # ⚠️ "THIS PUSH" IS THE WRONG QUESTION (OPS-02): a migration whose migrate-prod was rejected, failed
  # or cancelled while pending would never be retried by a later app-only push. The script diffs from
  # the last commit a migrate-prod SUCCEEDED on, and answers `true` whenever it cannot tell.
  # Read-only: it only lists this workflow's runs and jobs (`actions: read`).
  migrations-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p95 0.6 min over 26 runs; 10 min floor (ARC-07; GitHub default 360)
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/migrations-pending.sh "${{ github.sha }}"

  migrate-prod:
    # ⚠️⚠️ STAGING-FIRST IS SUSPENDED WHILE NO STAGING PROJECT EXISTS — AND ONLY THEN (2026-09-23,
    # founder's decision, deploy loop D1). Before this, `needs: migrate-staging` alone meant a
    # skipped staging job skipped this job too: measured on every main deploy, `migrate-prod`
    # never ran and production migrations had no path at all. Now:
    #   · STAGING_PROJECT_REF empty  → runs after a green CI, straight to the production-db approval;
    #   · STAGING_PROJECT_REF set    → runs ONLY after migrate-staging SUCCEEDED (staging-first is
    #     back automatically — a skipped or failed staging job skips this one);
    #   · no migration file changed in the push → skipped, so nothing waits for a human.
    # The approval is the gate either way: `production-db` has a required reviewer, admin bypass off.
    # A staging project is OWED before the first real family (docs/legal/LOOP-STATE.md).
    needs: [ci, migrate-staging, migrations-changed]
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.migrations-changed.outputs.changed == 'true' && vars.PROD_PROJECT_REF != '' && (needs.migrate-staging.result == 'success' || (needs.migrate-staging.result == 'skipped' && vars.STAGING_PROJECT_REF == '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p95 0.6 min over 5 runs. approval wait is not run time (separate 30-day gate limit, GitHub limits doc) (ARC-07; GitHub default 360)
    # A required-reviewer protection rule on this GitHub Environment means a human approves every
    # production schema change.
    environment: production-db   # NOT Vercel's `Production` — see docs/migrate-prod-proposal.md. Create it WITH its required-reviewer rule when enabling this job, not before.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0   # pinned: `latest` asks the GitHub API and a rate limit failed a deploy (2026-09-17)
      # ⚠️ THE REF IS ASSERTED IN THE REPO, NOT TRUSTED FROM THE DASHBOARD. `PROD_PROJECT_REF` sat
      # at the decommissioned Sydney project for two days after the region move (2026-09-05). A
      # wrong ref does not fail — it SUCCEEDS against the wrong database and reports green.
      - name: Refuse unless the configured ref is this repo's production
        env:
          PROD_PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
        run: scripts/assert-prod-ref.sh
      # ⚠️ A BACKUP BEFORE EVERY PRODUCTION MIGRATION (OPS-08). There is no PITR, so the only undo for
      # a bad migration is a restore — and before this the newest copy could be up to a day old (on
      # D6 the manual backup finished 23 s before the migration applied, by luck). This is the SAME
      # composite backup.yml runs nightly: read-only pg_dump, encrypted, uploaded as an artifact with
      # the same 30-day retention. It sits AFTER the ref assertion (never dump an unasserted ref) and
      # BEFORE `db push`; if it fails, the job stops here and nothing is applied.
      - name: Back up production before migrating
        uses: ./.github/actions/prod-backup
        with:
          project-ref: ${{ vars.PROD_PROJECT_REF }}
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          db-password: ${{ secrets.PROD_DB_PASSWORD }}
          passphrase: ${{ secrets.BACKUP_PASSPHRASE }}
          artifact-name: milo-db-backup-premigrate-${{ github.run_id }}
      - name: Apply migrations to prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.PROD_PROJECT_REF }}"
          supabase db push
