name: Ledger repair (one-shot, D4)

# ⚠️ ONE-SHOT. Records four migrations as applied on production WITHOUT RUNNING THEIR SQL, so that
# `supabase db push` then sees exactly the four new migrations (the consent gate). Why, what was measured
# and what it refuses: scripts/ledger-repair.sh, and docs/legal/LOOP-STATE.md "THE D4 PLAN".
#
# It writes ONLY ledger rows (supabase_migrations.schema_migrations) — no schema, no data. It refuses to
# run twice. Once it has succeeded, a follow-up PR deletes this file and scripts/ledger-repair.sh.
#
# Manual only, from main only, behind the production-db environment (required reviewer, admin bypass off),
# and in the same concurrency group as Deploy so it can never run while migrate-prod is pushing.

on:
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-db
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0   # pinned, as in deploy.yml
      - name: Refuse unless the configured ref is this repo's production
        env:
          PROD_PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
        run: scripts/assert-prod-ref.sh
      - name: Repair the ledger (one-shot)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "${{ vars.PROD_PROJECT_REF }}"
          scripts/ledger-repair.sh --linked
