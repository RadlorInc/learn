name: CI

on:
  pull_request:
    branches: [main]
  workflow_call: # reused by deploy.yml on push to main (avoids double-running on push)

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # p95 4.5 min over 56 runs (PR + deploy); 3x (ARC-07; GitHub default 360)
    env:
      # Placeholder public env so `next build` can construct the client at build time.
      # Real values come from Vercel at deploy; these are non-secret build-time stand-ins.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24   # = the Vercel project's nodeVersion (24.x); CI must test the Node production runs
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx next build
      - name: Dependency audit (fail on high/critical in what ships)
        # A new HIGH or CRITICAL advisory in a package the app ships fails the build instead of sitting
        # unnoticed; moderates (e.g. postcss via next) don't gate. Dev-only tools are not shipped, so
        # they do not gate: on 2026-10-04 an advisory with no fixed version in `braces` (under
        # eslint-config-next, lint only) turned every PR red with no possible fix. See docs/architecture.md §10.
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit, dev tools (report only)
        # Still printed on every run so a dev-tool advisory is seen; it just cannot block a merge.
        run: npm audit --audit-level=high || echo "::warning::npm audit found high/critical advisories in dev-only packages (not shipped) — see the log above"

  # ─────────────────────────────────────────────────────────────────────────────
  # RLS regression suite — proves the database DENIES a cross-tenant attacker.
  #
  # ⚠️⚠️ THIS JOB USED TO REPORT SUCCESS WHILE EXECUTING NOTHING. It was gated on a
  # SUPABASE_DB_URL secret that was never set, so it printed a ::warning:: and `exit 0`.
  # On a children's app, the one suite that proves account A cannot read account B's data
  # had therefore never run — and the green tick said the opposite, which is worse than
  # having no job at all. The skip path is gone. There is no way for this job to pass
  # without the suite running to completion.
  #
  # It needs no secret and no cloud database: `supabase db start` brings up a local
  # Postgres in Docker on the runner. Nothing here can touch production.
  # ─────────────────────────────────────────────────────────────────────────────
  rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p95 2.5 min over 56 runs; 10 min floor (ARC-07; GitHub default 360)
    permissions:
      contents: read
      packages: read # sign in to ghcr.io with this run's own GITHUB_TOKEN to pull Supabase's public images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0   # pinned: `latest` asks the GitHub API and a rate limit failed a deploy (2026-09-17)

      - name: CLI + config
        run: |
          supabase --version
          cat supabase/config.toml

      # ⚠️ THE BASELINE IS STAGED HERE AND DELIBERATELY NOT COMMITTED INTO migrations/.
      # Seven tables (profiles, learners, learner_access, sessions, learner_progress,
      # learner_stats, learner_invites) were created in the Supabase dashboard and are in
      # ZERO migrations, so a database built from supabase/migrations/* alone does not have
      # them and the suite dies at setup. supabase/schema/baseline_schema.sql reconstructs
      # them from the production catalog.
      #
      # It must run BEFORE the 67 real migrations (they ALTER these tables), which means a
      # version that sorts first. Committing such a file would mean `supabase db push`
      # applying a backdated migration to PRODUCTION, where every object already exists and
      # where the policy re-creation it performs would briefly drop live policies. Copying it
      # in here, on a throwaway runner, gets the ordering without ever putting it on a path
      # that can reach prod.
      - name: Stage baseline schema as the first migration (CI only, never committed)
        run: cp supabase/schema/baseline_schema.sql supabase/migrations/00000000000000_baseline.sql

      # ⚠️ THE DATABASE IMAGES ARE PULLED SIGNED IN, NEVER ANONYMOUSLY. Both public registries have refused anonymous
      # pulls from GitHub's shared runner IPs: ghcr.io on 2026-09-23 (`toomanyrequests` for hours, every PR red) and
      # public.ecr.aws on 2026-09-28 (`toomanyrequests: Data limit exceeded`, two deploy runs of #309 red before a
      # single assertion ran). Switching anonymous registries only moved the failure; signing in is the fix.
      #
      # So: `docker login ghcr.io` with this run's own GITHUB_TOKEN (no stored secret, nothing paid), then pull, with
      # backoff, every image `supabase db start` needs. MEASURED 2026-09-28, not assumed: `db start` pulls FOUR images
      # (postgres, realtime, storage-api, gotrue), not one. The tags come from the pinned CLI (`supabase services`), so
      # a CLI bump cannot leave this pulling yesterday's images.
      #
      # The CLI looks in the local cache before it pulls (DockerResolveImageIfNotCached, CLI v2.117.0), and with
      # SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io the cached ghcr.io names are the only ones it looks for — so
      # `db start` pulls nothing. And if a future CLI needs an image missing from the list, its own pull still reads
      # this login (GetRegistryAuthForImage), so it is signed in too; the next step says so rather than hiding it.
      - name: Pull the database images from ghcr.io, signed in
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -uo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || { echo "::error::docker login ghcr.io failed"; exit 1; }
          services=$(supabase services -o json)
          echo "### 🐘 Database images — pulled from ghcr.io, signed in" >> "$GITHUB_STEP_SUMMARY"
          for name in postgres realtime storage-api gotrue; do
            # `-o json` prints a bare array; the non-TTY default wraps it in {"services": …}. Accept either.
            tag=$(jq -r --arg n "supabase/$name" '(.services? // .)[] | select(.name == $n) | .local' <<<"$services")
            if [ -z "$tag" ] || [ "$tag" = null ]; then
              echo "::error::supabase services names no supabase/$name image — cannot tell which tag db start will want"
              exit 1
            fi
            img="ghcr.io/supabase/$name:$tag"
            ok=
            for wait in 0 10 30 60; do
              sleep "$wait"
              if docker pull -q "$img"; then ok=1; break; fi
              echo "pull of $img failed; trying again"
            done
            if [ -z "$ok" ]; then
              echo "::error::ghcr.io refused $img four times over 100 s, signed in"
              exit 1
            fi
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$img")
            echo "$img <- $digest"
            echo "- \`$img\` ← \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Start local Postgres and apply baseline + migrations
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          supabase db start 2>&1 | tee /tmp/db-start.log
          # ⚠️ SAY WHETHER THE CLI HAD TO PULL ANYTHING ITSELF. Measured 2026-09-28 with nothing cached: `db start` prints
          # "<tag>: Pulling from supabase/<name>" and "Downloaded newer image for …" for each image it pulls (8 lines for 4
          # images); with the step above done it printed none. A line here means the list above is missing an image —
          # still pulled signed in, but without this job's backoff — so it is a warning, not a red deploy.
          pulled=$(grep -E 'Pulling from|Downloaded newer image' /tmp/db-start.log || true)
          if [ -n "$pulled" ]; then
            echo "::warning::supabase db start pulled images itself; add them to the pull step above: $(echo "$pulled" | tr '\n' ' ')"
          else
            echo "supabase db start pulled nothing: every image came from the signed-in step above."
          fi
          echo "database container runs: $(docker ps --filter name=supabase_db_ --format '{{.Image}}')"

      - name: Run the RLS regression suite
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_regression.sql 2>&1 | tee /tmp/rls.log
          psql_status=${PIPESTATUS[0]}
          if [ "$psql_status" -ne 0 ]; then
            echo "::error::rls_regression.sql failed (psql exit $psql_status) — an assertion denied, or the file could not run."
            exit 1
          fi

          # ⚠️ EXIT 0 IS NOT ENOUGH. A file that is empty, truncated, or whose DO block was
          # commented out also exits 0. The suite prints how many assertions it actually
          # executed; no line, or a zero, means nothing was proven and the job fails.
          count=$(grep -oE 'RLS_ASSERTIONS=[0-9]+' /tmp/rls.log | tail -1 | cut -d= -f2)
          if [ -z "${count:-}" ]; then
            echo "::error::No RLS_ASSERTIONS line in the output — the suite did not run to completion."
            exit 1
          fi
          if [ "$count" -lt 1 ]; then
            echo "::error::The suite ran $count assertions. An empty suite reports the same green as a passing one."
            exit 1
          fi

          echo "RLS regression suite: $count assertions executed and passed."
          echo "### 🔒 RLS regression: **$count** assertions executed and passed" >> "$GITHUB_STEP_SUMMARY"

      # ═══════════════════════════════════════════════════════════════════════════════════════
      #  ⚠️⚠️ EXERCISE THE ROLLBACK. A ROLLBACK NOBODY HAS RUN IS A DOCUMENT, NOT A ROLLBACK.
      #
      #  It is the one artefact in the billing plan that only ever gets used on the worst day —
      #  which is the worst possible day to discover it does not parse. Reading it already caught
      #  one defect (pg_policies reports a null qual for an INSERT policy, so the capture emitted
      #  `using (true)`, which is not valid DDL). Reading is not running.
      #
      #  This applies the billing migrations (they are part of the replay above), then RUNS the
      #  rollback, then asserts production's captured fingerprints come back — the three function
      #  bodies and the two policy predicates, hashed the same way they were captured from
      #  production on 2026-08-24.
      # ═══════════════════════════════════════════════════════════════════════════════════════
      # ═══════════════════════════════════════════════════════════════════════════════════════
      #  ⚠️ NEWEST MIGRATION ROLLED BACK FIRST. `rollback_20260824_billing.sql` drops
      #  `subscription_seats`, which is the table `materialize_seats` writes — so this runs before it.
      #
      #  ⚠️⚠️ AND THE FINGERPRINT PUBLISHED HERE INCLUDES THE **ACL**, WHICH IS THE THING THAT MADE
      #  THE 2026-08-25 FINDING WRONG. `materialize_seats` is REVOKEd from public/anon/authenticated
      #  and its one real caller is the webhook, arriving as `service_role`; whether that call works
      #  is a property of the ACL, and it was first REPORTED (as broken) from reading the source
      #  rather than from asking a database. So the job prints what BOTH roles can actually do, and
      #  an apply is proven by reproducing it. rls_regression M6/M7 drive the same pair as SQL.
      # ═══════════════════════════════════════════════════════════════════════════════════════
      - name: Exercise the seat-materialiser rollback against the throwaway database
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail

          # ⚠️ POSITIVE CONTROL FIRST — otherwise "the function is gone" passes on a database where
          # it was never created, which is an absence asserted about nothing.
          before=$(psql "$PGURL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='materialize_seats'")
          echo "before rollback: materialize_seats present=$before"
          if [ "$before" -ne 1 ]; then
            echo "::error::materialize_seats is not applied, so rolling it back proves nothing"
            exit 1
          fi

          echo "── fingerprint of the applied seat materialiser ──"
          psql "$PGURL" -Atc "select 'materialize_seats body ' || md5(lower(regexp_replace(regexp_replace(prosrc,'--[^\n]*','','g'),'\s+','','g'))) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='materialize_seats'"
          psql "$PGURL" -Atc "select 'materialize_seats acl  service_role=' || has_function_privilege('service_role', p.oid, 'EXECUTE') || ' authenticated=' || has_function_privilege('authenticated', p.oid, 'EXECUTE') || ' anon=' || has_function_privilege('anon', p.oid, 'EXECUTE') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='materialize_seats'"

          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/schema/rollback_20260825_seat_materialiser.sql

          after=$(psql "$PGURL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='materialize_seats'")
          if [ "$after" -ne 0 ]; then
            echo "::error::materialize_seats survived its own rollback (count $after)"
            exit 1
          fi
          echo "  ok  materialize_seats dropped"
          echo "### ♻️ Seat-materialiser rollback exercised" >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise the billing rollback against the throwaway database
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail

          # ⚠️ POSITIVE CONTROL FIRST. Without it this whole step passes on a database where the
          # billing migrations never applied — asserting that objects are absent when they were
          # never present. A scan that finds nothing proves nothing until it has been shown it can
          # find something.
          before_tables=$(psql "$PGURL" -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('subscriptions','subscription_seats','billing_events','billing_config')")
          # (The second control was the guard on the "sessions: parent can insert" policy; that policy went with the
          # legacy progress tables in 20260928190000. is_chapter_entitled is the guard's one remaining home.)
          before_guard=$(psql "$PGURL" -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='is_chapter_entitled'")
          echo "before rollback: billing tables=$before_tables, is_chapter_entitled present=$before_guard"
          if [ "$before_tables" -ne 4 ] || [ "$before_guard" -ne 1 ]; then
            echo "::error::the billing migrations are not applied, so rolling them back proves nothing"
            exit 1
          fi

          # ⚠️⚠️ PUBLISH THE FINGERPRINT OF THE ARTEFACT THIS JOB ACTUALLY TESTED, BEFORE UNDOING IT.
          #
          # The billing migrations ship with `billing_config.enforced = false`, and this suite turns
          # it ON (F0) — so the enforcing path is exercised HERE and nowhere else. On production the
          # flag stays false, which means the post-apply smoke write succeeds whether or not the
          # guard is correctly wired: a check that cannot fail in the interesting direction.
          #
          # So the proof that production got the guard is EQUALITY WITH THIS ARTEFACT, not the live
          # write. This hash is what an apply must reproduce; the live write is only the smoke test that
          # nothing else broke. (The sessions / learner_progress policies and sync_session / sync_diagnostic
          # were fingerprinted here too until 20260928190000 removed them.)
          echo "── fingerprints of the applied (enforcing-capable) schema ──"
          psql "$PGURL" -Atc "select 'is_chapter_entitled  ' || md5(lower(regexp_replace(regexp_replace(prosrc,'--[^\n]*','','g'),'\s+','','g'))) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='is_chapter_entitled'"

          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/schema/rollback_20260824_billing.sql

          # The fingerprints captured from PRODUCTION before anything was applied.
          expect() {
            got=$(psql "$PGURL" -Atc "$2")
            if [ "$got" != "$3" ]; then
              echo "::error::$1 did not come back: got $got, expected $3"
              exit 1
            fi
            echo "  ok  $1"
          }
          # A billing rollback must not bring back what 20260928190000 retired: no legacy write function, no client
          # write policy on sessions.
          expect "no legacy write function came back" \
            "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('sync_session','sync_diagnostic')" \
            "0"
          expect "no client write policy on sessions came back" \
            "select count(*) from pg_policies where schemaname='public' and tablename='sessions' and cmd in ('INSERT','UPDATE','DELETE','ALL')" \
            "0"
          expect "billing tables are gone" \
            "select count(*) from information_schema.tables where table_schema='public' and table_name in ('subscriptions','subscription_seats','billing_events','billing_config')" \
            "0"
          expect "is_chapter_entitled is gone" \
            "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='is_chapter_entitled'" \
            "0"
          echo "### ♻️ Billing rollback exercised: production's fingerprints restored" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true
