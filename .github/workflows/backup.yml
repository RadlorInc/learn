name: Backup (prod database)

# WHY THIS EXISTS: the Supabase org is on the FREE plan, and Supabase's own docs say
# "Database backups are not available for download for Free Plan projects" — so there is currently
# NO restorable copy of the children's data that the founder controls. Their stated recommendation
# for this tier is to export regularly with the CLI and keep it off-site. This is that export.
#
# It is a stop-gap, not a backup strategy: retention is capped by GitHub's artifact limit and a
# nightly dump means an RPO of up to 24 hours. The real answer is Pro + PITR (see docs/devops.md);
# delete this workflow the day that is enabled, rather than keeping two half-strategies.
#
# ⚠️ THE DUMP IS ENCRYPTED, AND THAT IS NOT OPTIONAL. It contains learner display names and every
# session a child has played. A workflow artifact is readable by anyone with repo access, so an
# unencrypted dump would take data that is currently protected by RLS and put it somewhere with no
# access control worth the name — i.e. it would undo the whole security pass to "have a backup".
#
# Restore:
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE \
#     -in milo-backup.tar.gz.enc | tar xz
#   # ⚠️⚠️ RUN THIS FIRST, OR THE RESTORE SILENTLY REOPENS V12.
#   # Supabase's own docs: on restore, "tables inherit ALL privileges from default privileges in the
#   # target database". THIS APP'S SECURITY MODEL IS PARTLY GRANTS, NOT ONLY POLICIES — the V12 fix
#   # (invite repointing → self-grant on a stranger's child) is a COLUMN-level grant of UPDATE(status)
#   # and nothing else, and the V19/touch_grades fixes are EXECUTE revokes. Restore onto a database
#   # with default privileges and those are handed straight back, with every RLS policy still looking
#   # correct. Verify with the four queries in docs/security.md § Schema drift AFTER any restore.
#   psql "$TARGET_DB_URL" -c 'ALTER DEFAULT PRIVILEGES IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated;'
#   psql "$TARGET_DB_URL" --single-transaction -v ON_ERROR_STOP=1 -f schema.sql \
#     -c 'SET session_replication_role = replica' -f data.sql
#
# ⚠️ `supabase db dump` runs pg_dump INSIDE A DOCKER CONTAINER (that is how it strips Supabase-managed
# schemas). ubuntu-latest ships Docker, so this works on the hosted runner — but it will not work on
# a self-hosted runner without a Docker daemon.
#
# ⚠️ A backup nobody has restored is a hope, not a backup. Rehearse it into a scratch project once.
# openssl rather than gpg deliberately: both exist on ubuntu-latest, but openssl is also on the
# maintainer's machine, so the encrypt AND the restore above were actually run end to end before
# shipping (round-trip byte-exact, wrong passphrase refused) instead of being written from memory.

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC daily, off the 03:17 error_events prune
  workflow_dispatch: # so a restore rehearsal can grab a fresh dump on demand

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Inert until configured, exactly like the RLS job in ci.yml: a workflow that fails red every
      # night for a missing secret trains everyone to ignore the red.
      - name: Check configuration
        id: cfg
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          REF: ${{ vars.PROD_PROJECT_REF }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PASSPHRASE" ] || [ -z "$REF" ]; then
            echo "::warning::Backup not configured (needs SUPABASE_ACCESS_TOKEN, BACKUP_PASSPHRASE, PROD_PROJECT_REF). See docs/devops.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest

      - name: Dump schema + data
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "${{ vars.PROD_PROJECT_REF }}"
          # Schema and data separately: a schema-only restore is what you want when recovering from
          # a bad migration, and it is useless if it is welded to 40 MB of rows.
          supabase db dump -f schema.sql
          # --use-copy is what Supabase's own restore procedure uses: COPY rather than a wall of
          # INSERTs, which restores faster and survives quoting edge cases in learner names.
          supabase db dump -f data.sql --use-copy --data-only
          # Fail loudly on an empty dump rather than uploading a 0-byte "backup" that looks fine in
          # the artifact list and is worthless on the day it is needed.
          test -s schema.sql || { echo "::error::schema.sql is empty"; exit 1; }
          test -s data.sql   || { echo "::error::data.sql is empty";   exit 1; }
          tar czf milo-backup.tar.gz schema.sql data.sql
          rm -f schema.sql data.sql

      - name: Encrypt
        if: steps.cfg.outputs.ready == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE \
            -in milo-backup.tar.gz -out milo-backup.tar.gz.enc
          rm -f milo-backup.tar.gz # never let the plaintext reach the upload step
          test -s milo-backup.tar.gz.enc
          # Prove the artifact is actually encrypted before it leaves the runner. Cheap, and it is
          # the one failure that would be silent: a passphrase misconfiguration that produced a
          # readable dump would look identical in the artifact list.
          if tar tzf milo-backup.tar.gz.enc >/dev/null 2>&1; then
            echo "::error::artifact is readable as a tarball — it is NOT encrypted"; exit 1
          fi

      - name: Upload
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: milo-db-backup-${{ github.run_id }}
          path: milo-backup.tar.gz.enc
          retention-days: 30
          if-no-files-found: error
